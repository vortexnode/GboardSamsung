name: Stage 5.3 Patch JUnit and Android MPP Artifact

on:
  push:
    branches: [ci/stage-5.3-gradle-verification]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: stage-5.3-patch-mpp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-tests:
    name: Test patches and build Android-compatible MPP
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout selected branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Configure Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      # This task runs the existing JVM JUnit suite and also creates a JVM jar.
      # Its MPP output is deliberately NOT uploaded or treated as installable.
      - name: Run patch JUnit tests
        id: junit
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew --no-daemon --stacktrace :patches:test

      # Morphe's Android packaging task must run AFTER :patches:test because
      # :patches:test depends on :patches:jar and would otherwise overwrite the MPP.
      - name: Build Android-compatible MPP
        id: android_mpp
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew --no-daemon --stacktrace :patches:buildAndroid

      - name: Verify Android DEX payload and locate final MPP
        id: mpp
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' -print | sort)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one final MPP, found ${#files[@]}."
            printf '%s\\n' "${files[@]}"
            exit 1
          fi
          mpp="${files[0]}"
          if ! unzip -Z1 "$mpp" | grep -Fxq 'classes.dex'; then
            echo "Rejected MPP: root classes.dex entry is missing."
            unzip -Z1 "$mpp" | head -80
            exit 1
          fi
          echo "path=$mpp" >> "$GITHUB_OUTPUT"
          sha256sum "$mpp"
          ls -lh "$mpp"

      - name: Upload verified Android MPP
        uses: actions/upload-artifact@v4
        with:
          name: gboard-samsung-stage-5.3-android-mpp
          path: ${{ steps.mpp.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload patch JUnit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gboard-samsung-stage-5.3-junit-reports
          path: patches/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7

      - name: Report JUnit status
        if: always()
        run: |
          if [ "${{ steps.junit.outcome }}" = "success" ]; then
            echo "Patch JUnit suite passed."
          else
            echo "::warning::Patch JUnit suite has failures. Android MPP packaging was still attempted and independently verified."
          fi
