name: Stage 5.3 Patch JUnit and MPP Artifact

on:
  push:
    branches: [ci/stage-5.3-gradle-verification]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: stage-5.3-patch-mpp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-tests:
    name: Build MPP and run patch JUnit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout selected branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Configure Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build MPP and execute patch JUnit tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./gradlew --no-daemon --stacktrace :patches:test

      # Always inspect the output: Gradle can create the MPP before a later test fails.
      - name: Locate MPP even when tests fail
        id: mpp
        if: always()
        shell: bash
        run: |
          mapfile -t files < <(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' -print 2>/dev/null | sort)
          if [ "${#files[@]}" -eq 1 ]; then
            echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
            ls -lh "${files[0]}"
          else
            echo "No unique MPP found; found ${#files[@]} file(s). Artifact upload will be skipped."
            printf '%s\\n' "${files[@]}"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload MPP build output (tests may have failed)
        uses: actions/upload-artifact@v4
        if: always() && steps.mpp.outputs.path != ''
        with:
          name: gboard-samsung-stage-5.3-mpp-build
          path: ${{ steps.mpp.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload patch JUnit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gboard-samsung-stage-5.3-junit-reports
          path: patches/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7
