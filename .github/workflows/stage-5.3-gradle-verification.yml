name: Stage 5.3 Gradle Verification

on:
  push:
    branches: [ci/stage-5.3-gradle-verification]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stage-5.3-gradle-verification.yml'
      - 'patches/**'
      - 'extensions/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: stage-5.3-gradle-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-verification:
    name: Compile, admission and extension unit tests (no packages)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Configure Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Compile patch production sources; generate target admission; verify capability wiring
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            :patches:compileKotlin \
            :patches:generateGboardVersionBindings \
            :patches:verifyGboardCapabilityWiring

      - name: Run extension JVM unit tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            :extensions:extension:testDebugUnitTest

      - name: Confirm package tasks were not requested
        run: |
          echo "This workflow requests production compilation, admission verification, and extension JVM tests only."
          echo "It does not request :patches:test, :patches:jar, assemble, bundle, package, release, or publishing tasks."
          echo "Patch JUnit tests remain deferred until a safe test task graph is designed."
