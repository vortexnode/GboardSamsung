name: Import upstream source

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downstream repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge upstream history
        id: merge
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_PAT" ]]; then
            echo "::error::Add a repository secret named GH_PAT with Contents: Read and write and Workflows: Read and write permissions."
            exit 1
          fi
          git remote add upstream https://github.com/jasonwu1994/Gboard-patches.git
          git fetch --no-tags upstream main

          DOWNSTREAM_SHA="$(git rev-parse HEAD)"
          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          BRANCH="import/upstream-${GITHUB_RUN_ID}"

          git switch -c "$BRANCH"
          # The two repositories both have a README.md. Resolve that one known
          # add/add conflict in favor of the downstream README; stop on every
          # other conflict so upstream source changes are never silently discarded.
          if ! git merge --allow-unrelated-histories --no-edit upstream/main; then
            mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U)
            if [[ "${CONFLICTS[*]}" != "README.md" ]]; then
              echo "::error::Unexpected upstream merge conflicts: ${CONFLICTS[*]}"
              exit 1
            fi
            git checkout --ours -- README.md
            git add README.md
            git commit --no-edit
          fi

          # Preserve the downstream project README and keep the upstream README separately.
          git show "$DOWNSTREAM_SHA:README.md" > README.md
          git show upstream/main:README.md > UPSTREAM_README.md
          printf '%s\n' "$UPSTREAM_SHA" > UPSTREAM_COMMIT.txt

          git add README.md UPSTREAM_README.md UPSTREAM_COMMIT.txt
          if ! git diff --cached --quiet; then
            git commit -m "docs: record imported upstream README and commit"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

      - name: Push import branch
        env:
          BRANCH: ${{ steps.merge.outputs.branch }}
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_PAT" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" \\
            push origin "HEAD:refs/heads/$BRANCH"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "Import Gboard Patches upstream" \
            --body "Imports the complete upstream Git history from https://github.com/jasonwu1994/Gboard-patches.

          Upstream commit: $UPSTREAM_SHA

          The downstream README and project documentation are preserved. The upstream README is retained as UPSTREAM_README.md. Review the diff and merge this PR to complete the import."
