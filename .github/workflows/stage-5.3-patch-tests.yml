name: Stage 5.3 Patch JUnit and MPP Artifact

on:
  push:
    branches: [ci/stage-5.3-gradle-verification]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: stage-5.3-patch-mpp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-tests:
    name: Build MPP and run patch JUnit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout selected branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Configure Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build MPP and execute patch JUnit tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./gradlew --no-daemon --stacktrace :patches:test

      - name: Verify exactly one MPP was produced
        id: mpp
        if: success()
        shell: bash
        run: |
          mapfile -t files < <(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' -print 2>/dev/null | sort)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one .mpp, found ${#files[@]}."
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
          ls -lh "${files[0]}"

      - name: Upload tested MPP artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gboard-samsung-stage-5.3-mpp
          path: ${{ steps.mpp.outputs.path }}
          if-no-files-found: error
          retention-days: 7
